<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>DeskCalendar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 文案由 i18n.js 按语言填入：data-i18n（文字）、data-i18n-title、data-i18n-placeholder、data-i18n-aria -->
  <div class="app">
    <header class="titlebar">
      <div class="brand"><span class="logo" aria-hidden="true"></span><span id="today-label"></span></div>
      <div class="win-actions">
        <button id="refresh-btn" class="icon" data-i18n-title="btn.refresh" data-i18n-aria="btn.refresh">↻</button>
        <button id="pin-btn" class="icon" data-i18n-title="btn.pin" data-i18n-aria="btn.pin" aria-pressed="false">📌</button>
        <button id="settings-btn" class="icon" data-i18n-title="btn.settings" data-i18n-aria="btn.settings">⚙</button>
        <button id="hide-btn" class="icon" data-i18n-title="btn.hide" data-i18n-aria="btn.hide">—</button>
      </div>
    </header>

    <div class="toolbar">
      <div class="seg" role="group" data-i18n-aria="view.group">
        <button data-view="month" aria-pressed="true" data-i18n="view.month"></button>
        <button data-view="week" aria-pressed="false" data-i18n="view.week"></button>
        <button data-view="day" aria-pressed="false" data-i18n="view.day"></button>
      </div>
      <h1 id="title"></h1>
      <div class="nav">
        <button id="new-event-btn" class="icon add-btn" data-i18n-title="btn.newEvent" data-i18n-aria="btn.newEvent">＋</button>
        <button id="today" class="text-btn" data-i18n="btn.today"></button>
        <button id="prev" class="icon" data-i18n-aria="nav.prev">‹</button>
        <button id="next" class="icon" data-i18n-aria="nav.next">›</button>
      </div>
    </div>

    <main class="main">
      <section id="month-view" class="month-view">
        <div id="weekdays" class="weekdays" aria-hidden="true"></div>
        <div id="grid" class="grid"></div>
        <div class="agenda">
          <div class="section-head"><h2 id="agenda-title"></h2><span id="agenda-count" class="muted"></span></div>
          <div id="agenda-list" class="agenda-list"></div>
        </div>
      </section>

      <section id="week-view" class="week-view" hidden>
        <div id="wk-head" class="wk-head"></div>
        <div id="wk-allday" class="wk-allday"></div>
        <div id="wk-scroll" class="wk-scroll"><div id="wk-grid" class="wk-grid"></div></div>
      </section>

      <section id="day-view" class="day-view" hidden>
        <div id="allday" class="allday"></div>
        <div id="timeline-scroll" class="timeline-scroll"><div id="timeline" class="timeline"></div></div>
      </section>

      <section id="welcome" class="welcome" hidden>
        <div class="welcome-icon" aria-hidden="true">📅</div>
        <h2 data-i18n="welcome.title"></h2>
        <p data-i18n="welcome.text"></p>
        <button class="primary" data-open-settings data-i18n="welcome.start"></button>
      </section>
    </main>

    <section id="tasks" class="tasks">
      <button id="tasks-toggle" class="tasks-head" aria-expanded="true">
        <span class="tasks-title"><span class="tasks-icon">✓</span> Google Tasks <span id="tasks-count" class="badge"></span></span>
        <span class="chev" aria-hidden="true">▾</span>
      </button>
      <div class="tasks-body">
        <div class="tasks-filter" role="group" data-i18n-aria="tasks.filter">
          <button data-filter="all" aria-pressed="true" data-i18n="tasks.all"></button>
          <button data-filter="today" aria-pressed="false" data-i18n="tasks.todayOverdue"></button>
          <button data-filter="selected" aria-pressed="false" data-i18n="tasks.selected"></button>
        </div>
        <div id="task-list" class="task-list"></div>
        <form id="new-task" class="new-task" autocomplete="off">
          <div class="nt-row">
            <span class="nt-plus" aria-hidden="true">＋</span>
            <input id="nt-title" type="text" maxlength="1024" data-i18n-placeholder="nt.placeholder" data-i18n-aria="nt.name" required>
            <button id="nt-add" type="submit" class="nt-add" data-i18n="nt.add"></button>
          </div>
          <div class="nt-row nt-options">
            <label class="nt-field" data-i18n-title="nt.due"><span>📅</span><input id="nt-date" type="date" data-i18n-aria="nt.due"></label>
            <label class="nt-field" data-i18n-title="nt.time"><span>⏰</span><input id="nt-time" type="time" data-i18n-aria="nt.time"></label>
            <select id="nt-list" data-i18n-aria="nt.list"></select>
          </div>
        </form>
      </div>
    </section>

    <footer class="status"><span id="status-text"></span><button id="open-gcal" class="text-btn" data-i18n-title="footer.openTitle" data-i18n="footer.open"></button></footer>
    <div id="toast" class="toast" role="status" hidden></div>
  </div>

  <dialog id="settings">
    <div class="dialog-head"><h2 data-i18n="settings.title"></h2><button class="icon" id="settings-close" data-i18n-aria="close">×</button></div>

    <section class="card">
      <h3 data-i18n="settings.account"></h3>
      <p id="account-status" class="muted"></p>
      <div id="setup-steps">
        <ol class="steps">
          <li><span data-i18n="setup.s1a"></span><button class="link" data-url="https://console.cloud.google.com/projectcreate" data-i18n="setup.cloudConsole"></button><span data-i18n="setup.s1b"></span></li>
          <li><span data-i18n="setup.s2a"></span><button class="link" data-url="https://console.cloud.google.com/apis/library/calendar-json.googleapis.com">Google Calendar API</button><span data-i18n="setup.s2and"></span><button class="link" data-url="https://console.cloud.google.com/apis/library/tasks.googleapis.com">Google Tasks API</button><span data-i18n="setup.s2b"></span></li>
          <li><span data-i18n="setup.s3a"></span><button class="link" data-url="https://console.cloud.google.com/auth/overview">Google Auth Platform</button><span data-i18n="setup.s3b"></span></li>
          <li data-i18n="setup.s4"></li>
          <li data-i18n="setup.s5"></li>
        </ol>
      </div>
      <div class="row">
        <button id="import-btn" class="secondary" data-i18n="btn.import"></button>
        <button id="connect-btn" class="primary" data-i18n="btn.connect"></button>
        <button id="cancel-btn" class="secondary" hidden data-i18n="btn.cancel"></button>
        <button id="disconnect-btn" class="danger" hidden data-i18n="btn.disconnect"></button>
      </div>
      <p id="auth-error" class="error" role="alert"></p>
    </section>

    <section class="card">
      <h3 data-i18n="settings.window"></h3>
      <label class="switch"><span><span data-i18n="pref.pinned"></span><small data-i18n="pref.pinnedHint"></small></span><input type="checkbox" id="pref-pinned"></label>
      <label class="switch"><span><span data-i18n="pref.autostart"></span><small id="autostart-hint" data-i18n="pref.autostartHint"></small></span><input type="checkbox" id="pref-autostart"></label>
      <label class="slider"><span><span data-i18n="pref.opacity"></span> <output id="opacity-out"></output></span><input type="range" id="pref-opacity" min="40" max="100" step="5"></label>
      <label class="lang-row"><span>语言 / Language</span>
        <select id="pref-lang">
          <option value="auto">跟随系统 / System</option>
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </label>
    </section>
    <p class="muted small" data-i18n="settings.footer"></p>
  </dialog>

  <dialog id="detail">
    <div class="dialog-head"><span id="detail-kind" class="eyebrow"></span><button class="icon" id="detail-close" data-i18n-aria="close">×</button></div>
    <h2 id="detail-title"></h2>
    <p id="detail-time" class="detail-time"></p>
    <p id="detail-meta" class="muted"></p>
    <p id="detail-notes" class="detail-notes"></p>
    <p id="detail-note" class="muted small" hidden></p>
    <div class="row">
      <button id="detail-edit" class="primary" hidden data-i18n="detail.edit"></button>
      <button id="detail-open" class="secondary" data-i18n="detail.open"></button>
      <button id="detail-complete" class="secondary" hidden data-i18n="detail.complete"></button>
      <button id="detail-delete" class="danger" hidden data-i18n="detail.delete"></button>
    </div>
  </dialog>

  <dialog id="editor">
    <div class="dialog-head"><h2 id="editor-heading" data-i18n="editor.new"></h2><button class="icon" id="editor-close" data-i18n-aria="close">×</button></div>
    <form id="editor-form" class="editor-form" autocomplete="off">
      <input id="ev-title" class="field title-field" maxlength="1024" data-i18n-placeholder="ev.titlePh" data-i18n-aria="ev.title" required>
      <label class="switch compact"><span data-i18n="ev.allDay"></span><input type="checkbox" id="ev-allday"></label>
      <div class="ev-times">
        <span class="ev-label" data-i18n="ev.start"></span><input type="date" id="ev-start-date" data-i18n-aria="ev.startDate" required><input type="time" id="ev-start-time" step="300" data-i18n-aria="ev.startTime">
        <span class="ev-label" data-i18n="ev.end"></span><input type="date" id="ev-end-date" data-i18n-aria="ev.endDate" required><input type="time" id="ev-end-time" step="300" data-i18n-aria="ev.endTime">
      </div>
      <label class="ev-cal"><span class="ev-label" data-i18n="ev.calendar"></span><select id="ev-calendar" data-i18n-aria="ev.calendar"></select></label>
      <input id="ev-location" class="field" maxlength="1000" data-i18n-placeholder="ev.locationPh" data-i18n-aria="ev.location">
      <textarea id="ev-description" class="field" rows="3" maxlength="8000" data-i18n-placeholder="ev.descriptionPh" data-i18n-aria="ev.description"></textarea>
      <p id="ev-recurring" class="muted small" hidden data-i18n="ev.recurring"></p>
      <p id="ev-error" class="error" role="alert"></p>
      <div class="row"><button type="submit" class="primary" id="ev-save" data-i18n="btn.save"></button><button type="button" class="secondary" id="ev-cancel" data-i18n="btn.cancel"></button></div>
    </form>
  </dialog>

  <script src="i18n.js"></script>
  <script src="calendar-core.js"></script>
  <script src="app.js"></script>
  <script src="editing.js"></script>
</body>
</html>
